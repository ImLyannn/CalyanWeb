<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk — RAK GEAR</title>
    <meta name="description" content="Detail spesifikasi produk RAK GEAR — order langsung lewat WhatsApp.">

    <link rel="icon" href="../gambar/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">

    <!-- Set tema sebelum render biar nggak ada kedipan warna -->
    <script>
        (function(){
            var saved = localStorage.getItem('rakgear-theme');
            var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            if(theme === 'light'){
                document.documentElement.setAttribute('data-theme','light');
            }
        })();
    </script>
</head>
<body>

    <!-- ================= NAVBAR ================= -->

    <nav>
        <div class="logo">
            <img id="LogoGambar" src="../gambar/logo.png" alt="RAK GEAR">
            RAK GEAR
        </div>

        <div class="nav-right">
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#product">Katalog</a></li>
                <li><a href="../index.html#about">Tentang</a></li>
            </ul>

            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ganti mode tampilan" title="Ganti mode tampilan">
                <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
        </div>
    </nav>

    <div class="back-container">
        <a href="../index.html#product" class="back-btn">‹‹ Kembali ke katalog</a>
    </div>

    <section class="product-detail" id="productDetail">
        <div class="product-image">
            <img id="pImage" src="" alt="">
        </div>

        <div class="product-info">
            <p class="card-stock" id="pStock"></p>
            <h1 id="pTitle"></h1>
            <h2 id="pPrice"></h2>
            <p id="pDescription"></p>

            <div class="spec-table" id="pSpecs"></div>

            <a class="hero-cta" id="pOrder" href="#" target="_blank">Order via WhatsApp</a>
        </div>
    </section>

    <section class="recommend">
        <h2>Produk Lainnya</h2>
        <div class="recommend-scroll" id="recommendContainer"></div>
    </section>

    <footer>
        <span>© 2026 RAK GEAR — Denpasar, Bali</span>
        <span>Dibuat buat portofolio PKL</span>
    </footer>

    <script>
        window.SITE_BASE = { img: "../gambar/", productPage: "product.html" };
    </script>
    <script src="../java/theme.js"></script>
    <script src="../java/data.js"></script>
    <script src="../java/catalog.js"></script>
    <script src="../java/product.js"></script>
</body>
</html>
